    <meta charset="UTF-8" />

    <title>AI Thám Tử Công Sở - Office Detective</title>
    <meta name="description" content="Trò chơi giải đố và suy luận tình huống công sở vui nhộn với chế độ Chơi Đơn và Thách Đấu 2 Đội." />
    <meta property="og:title" content="AI Thám Tử Công Sở" />
    <meta property="og:description" content="Nhìn tình huống → Tìm manh mối → Phá bẫy → Trả lời đúng!" />
    <meta property="og:type" content="website" />
    <script>
      (function () {
        try {
          var originalFetch = window.fetch;
          if (typeof originalFetch === 'function') {
            var currentFetch = originalFetch.bind(window);
            Object.defineProperty(window, 'fetch', {
              get: function () {
                return currentFetch;
              },
              set: function (val) {
                currentFetch = val;
              },
              configurable: true,
              enumerable: true,
            });
          }
        } catch (e) {
          // ignore if environment restricts property definition
        }
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
